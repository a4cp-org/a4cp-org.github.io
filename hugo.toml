baseURL = '/'
relativeURLs = false
languageCode = 'en-us'
title = 'Association for Constraint Programming'
theme = 'PaperMod'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
    mainSections = []
    env = 'production'
    description = 'Association for Constraint Programming (ACP)'
    author = 'ACP'
    
    [params.label]
        text = "Association for Constraint Programming"
        icon = "/sites/default/files/acp-small-color-logo.jpg"
        iconHeight = 40

    # PaperMod specific options
    ShowReadingTime = false
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = true

    
